{{- if .Values.config.configFile.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  labels:
    app: {{ .Chart.Name }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.json: |-
    {{- $configFile := .Values.config.configFile.path }}
    {{ (.Files.Get $configFile) | nindent 4 }}
{{- end }}
